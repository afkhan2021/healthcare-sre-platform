apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-receiver
  namespace: healthcare-dev
  labels:
    app: incident-receiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: incident-receiver
  template:
    metadata:
      labels:
        app: incident-receiver
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: incident-receiver
          image: 056283020027.dkr.ecr.ca-central-1.amazonaws.com/healthcare-incident-receiver:v6
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8001
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
