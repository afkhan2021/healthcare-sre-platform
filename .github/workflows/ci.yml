name: Healthcare SRE Platform CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: API Tests and Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: application/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r application/requirements-dev.txt
          python -m pip install -r application/requirements.txt

      - name: Run tests with coverage
        run: |
          PYTHONPATH=application python -m pytest application/tests/test_main.py \
            --cov=app.main \
            --cov-report=term-missing \
            --cov-fail-under=90 \
            -v

  security:
    name: Python and Container Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit pip-audit

      - name: Run Bandit security scan
        run: |
          bandit -r application/app -ll

      - name: Audit API dependencies
        run: |
          pip-audit -r application/requirements.txt

      - name: Audit incident receiver dependencies
        run: |
          pip-audit -r automation/incident-assistant/requirements.txt

      - name: Build Healthcare API image
        run: |
          docker build \
            -f application/Dockerfile \
            -t healthcare-sre-api:ci \
            -t healthcare-sre-api:${GITHUB_SHA} \
            .

      - name: Build Incident Receiver image
        run: |
          docker build \
            -f automation/incident-assistant/Dockerfile \
            -t healthcare-incident-receiver:ci \
            -t healthcare-incident-receiver:${GITHUB_SHA} \
            .

      - name: Trivy API image vulnerability report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.2
          image-ref: healthcare-sre-api:${{ github.sha }}
          scanners: vuln
          ignore-policy: .trivyignore.rego
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          format: table
          exit-code: '0'

      - name: Trivy API critical vulnerability gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.2
          skip-setup-trivy: true
          image-ref: healthcare-sre-api:${{ github.sha }}
          scanners: vuln
          ignore-policy: .trivyignore.rego
          severity: CRITICAL
          format: table
          exit-code: '1'

      - name: Trivy Incident Receiver vulnerability report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.2
          skip-setup-trivy: true
          image-ref: healthcare-incident-receiver:${{ github.sha }}
          scanners: vuln
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          format: table
          exit-code: '0'

      - name: Trivy Incident Receiver critical vulnerability gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.2
          skip-setup-trivy: true
          image-ref: healthcare-incident-receiver:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL
          format: table
          exit-code: '1'

      - name: Generate Healthcare API CycloneDX SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.2
          skip-setup-trivy: true
          image-ref: healthcare-sre-api:${{ github.sha }}
          scanners: vuln
          format: cyclonedx
          output: healthcare-sre-api-sbom.cdx.json
          exit-code: '0'

      - name: Generate Incident Receiver CycloneDX SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.2
          skip-setup-trivy: true
          image-ref: healthcare-incident-receiver:${{ github.sha }}
          scanners: vuln
          format: cyclonedx
          output: healthcare-incident-receiver-sbom.cdx.json
          exit-code: '0'

      - name: Upload container SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: container-sboms
          path: |
            healthcare-sre-api-sbom.cdx.json
            healthcare-incident-receiver-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  kubernetes-security:
    name: Kubernetes Manifest Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Trivy Kubernetes manifest scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.2
          scan-type: config
          scan-ref: kubernetes/
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          format: table
          exit-code: '0'

  publish-images:
    name: Publish Verified Images to Amazon ECR
    runs-on: ubuntu-latest
    needs:
      - test
      - security
      - kubernetes-security

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.AWS_ROLE_TO_ASSUME != '' &&
      vars.AWS_REGION != ''

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Healthcare API image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker build \
            -f application/Dockerfile \
            -t "$REGISTRY/healthcare-sre-api:$IMAGE_TAG" \
            .
          docker push "$REGISTRY/healthcare-sre-api:$IMAGE_TAG"

      - name: Build and push Incident Receiver image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker build \
            -f automation/incident-assistant/Dockerfile \
            -t "$REGISTRY/healthcare-incident-receiver:$IMAGE_TAG" \
            .
          docker push "$REGISTRY/healthcare-incident-receiver:$IMAGE_TAG"
