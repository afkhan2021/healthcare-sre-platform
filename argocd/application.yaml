apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: healthcare-sre-platform-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/afkhan2021/healthcare-sre-platform.git
    targetRevision: main
    path: kubernetes

  destination:
    server: https://kubernetes.default.svc
    namespace: healthcare-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true